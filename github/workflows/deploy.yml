name: Deploy to Railway

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code so the workflow can see it
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install the Railway CLI inside the GitHub Actions runner
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Step 3: Deploy to Railway using your account token
      - name: Deploy to Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}